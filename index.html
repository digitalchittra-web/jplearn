<title>Nihongo Dojo</title>
<style>
  :root{
    --bg: #fdfaf4;
    --surface: #ffffff;
    --surface-alt: #f6f1e6;
    --ink: #2b2318;
    --ink-soft: #8a7f6a;
    --accent: #ff5a3c;
    --accent-soft: #ff5a3c17;
    --gold: #e69a0d;
    --gold-soft: #e69a0d1a;
    --jade: #16b384;
    --jade-soft: #16b3841a;
    --indigo: #4f5fd6;
    --indigo-soft: #4f5fd61a;
    --line: #f0e8d6;
    --line-strong: #e3d6b8;
    --shadow-sm: 0 1px 2px rgba(60,42,10,0.05), 0 10px 24px -16px rgba(60,42,10,0.22);
    --shadow-md: 0 2px 4px rgba(60,42,10,0.06), 0 16px 36px -18px rgba(60,42,10,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1c1811;
      --surface: #272119;
      --surface-alt: #322a1f;
      --ink: #f6efe1;
      --ink-soft: #b8ab90;
      --accent: #ff8266;
      --accent-soft: #ff826626;
      --gold: #ffc24d;
      --gold-soft: #ffc24d26;
      --jade: #3ce0ac;
      --jade-soft: #3ce0ac26;
      --indigo: #93a0ff;
      --indigo-soft: #93a0ff26;
      --line: #3c3324;
      --line-strong: #4f4430;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -16px rgba(0,0,0,0.5);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.32), 0 16px 36px -18px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg: #1c1811;
    --surface: #272119;
    --surface-alt: #322a1f;
    --ink: #f6efe1;
    --ink-soft: #b8ab90;
    --accent: #ff8266;
    --accent-soft: #ff826626;
    --gold: #ffc24d;
    --gold-soft: #ffc24d26;
    --jade: #3ce0ac;
    --jade-soft: #3ce0ac26;
    --indigo: #93a0ff;
    --indigo-soft: #93a0ff26;
    --line: #3c3324;
    --line-strong: #4f4430;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -16px rgba(0,0,0,0.5);
    --shadow-md: 0 2px 4px rgba(0,0,0,0.32), 0 16px 36px -18px rgba(0,0,0,0.55);
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    padding-bottom: 5rem;
  }
  h1,h2,h3{ font-family: "Segoe UI Semibold", "Segoe UI", system-ui, -apple-system, sans-serif; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
  .jp{ font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", "MS Gothic", sans-serif; }
  button{ font-family: inherit; }
  a{ color: var(--accent); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .card, .quick-tile, .dash-card, .due-table, .stat-box, .ktile, .vrow,
  .persona-card, .chat-input, .choice, .stat-pill, .bubble.them{
    box-shadow: var(--shadow-sm);
  }
  .mission-card{ box-shadow: var(--shadow-md); }

  #app{ max-width: 30rem; margin: 0 auto; padding: 0 1rem; }
  #app.view-fade{ animation: viewIn 0.32s cubic-bezier(.22,1,.36,1) both; }
  @keyframes viewIn{ from{ opacity: 0; transform: translateY(10px); } to{ opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce){ #app.view-fade{ animation: none; } }

  @keyframes idleBreathe{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.045); } }
  .mascot{ animation: idleBreathe 3.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .mascot{ animation: none; } }

  .btn:active, .quick-tile:active, .ktile:active, .vrow:active, .path-node:not(.locked):active,
  .persona-card:active, .choice:not([disabled]):active, .navbtn:active, .region-card:not(.locked):active,
  .due-table .go:active{
    transform: scale(0.95);
  }

  /* -------- top bar -------- */
  .topbar{
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 0 0.75rem;
    max-width: 30rem; margin: 0 auto; padding-left: 1rem; padding-right: 3.85rem;
  }
  .brand{ display: flex; align-items: center; gap: 0.6rem; }
  .brand h1{ font-size: 1.25rem; }
  .stat-pill{
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--surface); border: 1px solid var(--line);
    padding: 0.35rem 0.65rem; border-radius: 999px;
    font-size: 0.8125rem; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stats-row{ display: flex; gap: 0.5rem; }
  .pill-flame{ color: var(--accent); }
  .pill-xp{ color: var(--gold); }

  /* -------- mascot -------- */
  .mascot{ flex-shrink: 0; transition: transform 0.35s cubic-bezier(.34,1.56,.64,1); }
  .mascot.bounce{ animation: bounce 0.5s cubic-bezier(.34,1.56,.64,1); }
  .mascot.shake{ animation: shake 0.4s ease; }
  @keyframes bounce{ 0%{transform:scale(1)} 40%{transform:scale(1.18) rotate(-4deg)} 100%{transform:scale(1)} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px) rotate(-3deg)} 75%{transform:translateX(6px) rotate(3deg)} }
  @media (prefers-reduced-motion: reduce){ .mascot, .mascot.bounce, .mascot.shake{ animation: none !important; transition: none !important; } }

  /* -------- cards / sections -------- */
  .card{
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 1.25rem;
  }
  .section-label{
    font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 700; margin: 1.75rem 0 0.6rem;
  }
  .mission-card{
    background: linear-gradient(155deg, var(--accent-soft), transparent 60%), var(--surface);
    border: 1px solid var(--line); border-radius: 20px; padding: 1.4rem;
    display: flex; flex-direction: column; gap: 0.9rem;
  }
  .mission-title{ font-size: 1.1rem; font-weight: 700; }
  .mission-sub{ color: var(--ink-soft); font-size: 0.9rem; }
  .btn{
    border: none; border-radius: 999px; padding: 0.8rem 1.3rem;
    font-weight: 700; font-size: 0.95rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  }
  .btn-primary{ background: var(--accent); color: #fff; }
  .btn-ghost{ background: var(--surface-alt); color: var(--ink); border: 1px solid var(--line); }
  .btn-block{ width: 100%; }
  .btn:active{ transform: scale(0.98); }

  .quick-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.65rem; margin-top: 1rem; }
  .quick-tile{
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 0.85rem 0.5rem; text-align: center; cursor: pointer; color: var(--ink);
  }
  .quick-tile .n{ font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; display:block; }
  .quick-tile .l{ font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }

  .banner{
    margin-top: 1.25rem; padding: 0.9rem 1rem; border-radius: 14px;
    background: var(--jade-soft); border: 1px solid var(--jade); color: var(--ink);
    font-size: 0.875rem;
  }

  /* -------- home mobile / desktop split -------- */
  .home-desktop{ display: none; }
  .home-mobile{ display: block; }

  .path-wrap{ position: relative; padding: 1.75rem 0 0.5rem; }
  .path-line{
    position: absolute; left: 50%; top: 0.5rem; bottom: 1.5rem; width: 4px; margin-left: -2px;
    background: repeating-linear-gradient(var(--line-strong) 0 8px, transparent 8px 18px);
    z-index: 0;
  }
  .path-nodes{ position: relative; z-index: 1; display: flex; flex-direction: column; gap: 1.5rem; align-items: center; }
  .path-node-row{ display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .path-node-row.odd{ transform: translateX(-2.5rem); }
  .path-node-row.even{ transform: translateX(2.5rem); }
  .path-node{
    width: 4rem; height: 4rem; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18); color: #fff;
  }
  .path-node .jp{ line-height: 1; }
  .path-node.locked{ background: var(--line-strong); color: var(--ink-soft); cursor: default; box-shadow: none; }
  .path-node.available{ background: var(--indigo); }
  .path-node.done{ background: var(--jade); }
  .path-node.current{ background: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 4px 0 rgba(0,0,0,0.18), 0 0 0 0 var(--accent-soft); }
    50%{ box-shadow: 0 4px 0 rgba(0,0,0,0.18), 0 0 0 10px transparent; }
  }
  @media (prefers-reduced-motion: reduce){ .path-node.current{ animation: none; } }
  .path-node-label{ font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); text-align: center; max-width: 6rem; }

  .dash-grid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
  .dash-card{ background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
  .dash-card .big{ font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dash-card .lbl{ font-size: 0.72rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.15rem; }
  .due-table{ width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .due-table td{ padding: 0.8rem 1rem; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .due-table tr:last-child td{ border-bottom: none; }
  .due-table .cnt{ font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .due-table .go{ background: var(--surface-alt); border: 1px solid var(--line); border-radius: 999px; padding: 0.4rem 0.85rem; font-size: 0.78rem; font-weight: 700; cursor: pointer; color: var(--ink); }

  .region-scroll{
    display: flex; gap: 0.9rem; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 0.15rem 1rem 0.6rem; margin: 0 -1rem 0.5rem; -webkit-overflow-scrolling: touch;
  }
  .region-card{
    position: relative; flex: 0 0 9.75rem; height: 12.5rem; border-radius: 22px; overflow: hidden;
    scroll-snap-align: start; color: #fff; box-shadow: var(--shadow-md); cursor: pointer;
  }
  .region-card.locked{ cursor: default; filter: saturate(0.45) brightness(0.82); }
  .region-mountain{
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 78%; height: 52%; background: rgba(255,255,255,0.22);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }
  .region-mountain::after{
    content: ""; position: absolute; top: 22%; left: 50%; width: 0.9rem; height: 0.9rem;
    transform: translateX(-50%); border-radius: 50%; background: rgba(255,255,255,0.5);
  }
  .region-lock{ position: absolute; top: 0.7rem; right: 0.7rem; font-size: 1rem; }
  .region-info{
    position: absolute; left: 0; right: 0; bottom: 0; padding: 0.85rem;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 80%);
  }
  .region-name{ font-weight: 800; font-size: 1.05rem; }
  .region-theme{ font-size: 0.7rem; opacity: 0.92; margin-top: 0.2rem; line-height: 1.35; }
  .region-badge{ font-size: 0.66rem; font-weight: 700; margin-top: 0.5rem; opacity: 0.95; letter-spacing: 0.02em; }

  /* -------- tabs -------- */
  .tabs{ display: flex; gap: 0.4rem; margin: 1.1rem 0 1rem; overflow-x: auto; }
  .tab{
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 0.5rem 0.95rem; font-weight: 700; font-size: 0.85rem;
    cursor: pointer; white-space: nowrap;
  }
  .tab.active{ background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .learn-heading{ display: none; font-size: 1.05rem; margin-bottom: 0.75rem; }
  .learn-section{ display: none; }
  .learn-section.active{ display: block; }

  /* -------- kana grid -------- */
  .kgrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr)); gap: 0.55rem; }
  .ktile{
    aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line);
    background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; color: var(--ink);
  }
  .ktile .c{ font-size: 1.5rem; font-weight: 700; }
  .ktile .r{ font-size: 0.65rem; color: var(--ink-soft); }
  .ktile.locked{ opacity: 0.35; cursor: default; }
  .ktile.b0{ box-shadow: inset 0 0 0 2px var(--line-strong); }
  .ktile.b1,.ktile.b2{ box-shadow: inset 0 0 0 2px var(--gold); background: var(--gold-soft); }
  .ktile.b3,.ktile.b4{ box-shadow: inset 0 0 0 2px var(--jade); background: var(--jade-soft); }
  .ktile.b5{ box-shadow: inset 0 0 0 2px var(--jade); background: var(--jade); }
  .ktile.b5 .c, .ktile.b5 .r{ color: #fff; }

  /* -------- vocab list -------- */
  .vlist{ display: flex; flex-direction: column; gap: 0.6rem; }
  .vrow{
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0.8rem 1rem;
    cursor: pointer;
  }
  .vrow .jp{ font-size: 1.15rem; font-weight: 700; }
  .vrow .romaji{ color: var(--ink-soft); font-size: 0.8rem; }
  .vrow .en{ color: var(--ink-soft); font-size: 0.85rem; text-align: right; }
  .box-dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
  .box-dot.due{ background: var(--accent); }
  .box-dot.mastered{ background: var(--jade); }

  /* -------- session -------- */
  .session{ display: flex; flex-direction: column; align-items: center; padding-top: 2.5rem; gap: 1.5rem; }
  .session-progress{ width: 100%; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .session-progress > div{ height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .prompt-jp{ font-size: 3.2rem; font-weight: 700; text-align: center; }
  .prompt-en{ font-size: 1.6rem; font-weight: 700; text-align: center; }
  .speak-btn{
    border: 1px solid var(--line); background: var(--surface-alt); border-radius: 999px;
    width: 2.6rem; height: 2.6rem; cursor: pointer; font-size: 1.1rem; color: var(--ink);
  }
  .choices{ display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; width: 100%; }
  .choice{
    border: 1px solid var(--line); background: var(--surface); border-radius: 14px;
    padding: 1rem 0.6rem; font-size: 1.05rem; font-weight: 700; cursor: pointer; color: var(--ink);
  }
  .choice.correct{ background: var(--jade-soft); border-color: var(--jade); color: var(--jade); }
  .choice.wrong{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .choice[disabled]{ cursor: default; }
  .session-exit{ align-self: flex-start; background: none; border: none; color: var(--ink-soft); font-size: 0.85rem; cursor: pointer; padding: 0; }

  .trace-canvas{
    width: 100%; max-width: 19rem; aspect-ratio: 1;
    background: var(--surface); border: 2px dashed var(--line-strong); border-radius: 22px;
    touch-action: none; box-shadow: var(--shadow-sm); cursor: crosshair;
  }
  .btn-row{ display: flex; gap: 0.6rem; width: 100%; margin-bottom: 1rem; }
  .btn-row .btn{ flex: 1; margin-bottom: 0; }

  .summary{ text-align: center; padding-top: 3rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .summary .xp-earned{ font-size: 2.4rem; font-weight: 800; color: var(--gold); }

  /* -------- talk -------- */
  .persona-row{ display: flex; gap: 0.6rem; margin-bottom: 1rem; }
  .persona-card{
    flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 14px;
    padding: 0.7rem; text-align: center; cursor: pointer;
  }
  .persona-card.active{ border-color: var(--indigo); background: var(--indigo-soft); }
  .persona-card .av{ font-size: 1.5rem; }
  .persona-card .nm{ font-weight: 700; font-size: 0.85rem; }
  .persona-card .rl{ font-size: 0.7rem; color: var(--ink-soft); }
  .chat-log{ display: flex; flex-direction: column; gap: 0.7rem; min-height: 16rem; margin-bottom: 0.85rem; }
  .bubble{ max-width: 82%; padding: 0.7rem 0.9rem; border-radius: 16px; font-size: 0.92rem; white-space: pre-wrap; }
  .bubble.them{ background: var(--surface-alt); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.me{ background: var(--indigo); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .chat-form{ display: flex; gap: 0.5rem; position: sticky; bottom: 4.5rem; }
  .chat-input{
    flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 0.75rem 1rem; font-size: 0.95rem;
  }
  .chat-send{ border: none; background: var(--indigo); color: #fff; border-radius: 999px; width: 3rem; cursor: pointer; font-size: 1.1rem; }
  .notice{ font-size: 0.85rem; color: var(--ink-soft); text-align: center; padding: 1.5rem 1rem; }

  /* -------- progress view -------- */
  .stat-block{ display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 1.25rem; }
  .stat-box{ background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
  .stat-box .big{ font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-box .lbl{ font-size: 0.75rem; color: var(--ink-soft); }
  .barlist{ display:flex; flex-direction: column; gap: 0.55rem; }
  .barrow{ display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; }
  .barrow .lbl{ width: 5.2rem; color: var(--ink-soft); flex-shrink: 0; }
  .barrow .track{ flex: 1; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .barrow .fill{ height: 100%; border-radius: 999px; }
  .barrow .val{ width: 2rem; text-align: right; font-variant-numeric: tabular-nums; }

  /* -------- nav -------- */
  nav.tabbar{
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    padding: 0.5rem 0.25rem calc(0.5rem + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbtn{
    background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
    color: var(--ink-soft); font-size: 0.65rem; font-weight: 700; padding: 0.3rem 0.6rem; cursor: pointer; border-radius: 10px;
  }
  .navbtn .ic{ font-size: 1.25rem; }
  .navbtn.active{ color: var(--accent); }

  @media (min-width: 880px){
    body{ padding-bottom: 0; padding-left: 6.5rem; }
    #app{ max-width: 58rem; padding: 0 1.5rem; }
    .topbar{ max-width: 58rem; padding-right: 4.25rem; }
    nav.tabbar{
      left: 0; right: auto; top: 0; bottom: 0; width: 6rem; flex-direction: column; justify-content: flex-start;
      padding: 1.5rem 0.5rem; border-top: none; border-right: 1px solid var(--line); gap: 0.5rem;
    }
    .navbtn{ font-size: 0.7rem; padding: 0.6rem 0.4rem; }
    .kgrid{ grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); }

    .home-mobile{ display: none; }
    .home-desktop{ display: block; }
    .dash-grid{ grid-template-columns: repeat(4, 1fr); }

    .tabs{ display: none; }
    .learn-heading{ display: block; }
    .learn-section{ display: block !important; margin-bottom: 2rem; }
    .learn-body{ display: grid; grid-template-columns: 1.3fr 1fr; gap: 2rem; align-items: start; }
  }

  .confetti-canvas{ position: fixed; inset: 0; pointer-events: none; z-index: 999; }

  .theme-toggle{
    position: fixed; top: 1rem; right: 1rem; z-index: 25;
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font-size: 1.15rem; cursor: pointer; box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center;
  }
  @media (min-width: 880px){ .theme-toggle{ top: 1.25rem; right: 1.5rem; } }
</style>

<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle light or dark theme">☀️</button>

<script>
(function(){
  "use strict";

  var HIRAGANA = [["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
    ["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],
    ["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],
    ["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],
    ["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],
    ["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],
    ["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],

  function todayStr(d){

  function shuffle(a){
    a = a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }

  function normalizeState(raw){

    if(raw && typeof raw==="object"){

      s.streak = typeof raw.streak==="number" ? raw.streak : 0;
      s.lastActiveDate = raw.lastActiveDate || null;

  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }

    return audioCtx;
  }
  function chime(good){
    var ctx = ensureAudio();
    if(!ctx) return;
    var now = ctx.currentTime;
    var freqs = good ? [659,880] : [220,164];
    freqs.forEach(function(f,i){
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = good ? "sine" : "triangle";
      o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      var t = now + i*0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
      o.start(t); o.stop(t+0.26);
    });
  }

  function confetti(){
    if(reduceMotion) return;
    var canvas = document.createElement("canvas");
    canvas.className = "confetti-canvas";
    document.body.appendChild(canvas);
    canvas.width = innerWidth; canvas.height = innerHeight;
    var ctx = canvas.getContext("2d");
    var css = getComputedStyle(document.documentElement);
    var colors = [css.getPropertyValue("--accent"), css.getPropertyValue("--gold"), css.getPropertyValue("--jade"), css.getPropertyValue("--indigo")];
    var particles = [];
    for(var i=0;i<70;i++){
      particles.push({
        x: innerWidth/2 + (Math.random()-0.5)*220, y: innerHeight*0.35,
        vx: (Math.random()-0.5)*8, vy: Math.random()*-7-2, g: 0.28,
        size: 4+Math.random()*5, color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.35
      });
    }
    var frame = 0;
    function tick(){
      frame++;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        ctx.restore();
      });
      if(frame<95) requestAnimationFrame(tick); else canvas.remove();
    }
    requestAnimationFrame(tick);
  }

  function recordAnswer(store, key, correct){
    var e = S[store][key] || {box:0, seen:0, correct:0, due:0};
    e.seen++;
    if(correct) e.correct++;
    e.box = correct ? Math.min(5, e.box+1) : 0;
    var days = INTERVAL_DAYS[e.box]!=null ? INTERVAL_DAYS[e.box] : 16;
    e.due = Date.now() + days*86400000;
    S[store][key] = e;
    S.xp += correct ? 10 : 3;
    persist();
  }

  function kanaUnlocked(list, idx){
    if(idx===0) return true;
    var cutoff = Math.floor(idx/NEW_KANA_BATCH)*NEW_KANA_BATCH;
    if(idx < NEW_KANA_BATCH) return true;
    var prevBatchStart = cutoff - NEW_KANA_BATCH;
    for(var i=prevBatchStart;i<cutoff;i++){
      var e = S.kana[list[i][0]];
      if(!e || e.box<1) return false;
    }
    return true;
  }

  function kanaDueList(list){
    var out=[];
    for(var i=0;i<list.length;i++){ if(kanaUnlocked(list,i) && isDue(S.kana[list[i][0]])) out.push(list[i]); }
    return out;
  }
  function kanaUnlockedList(list){
    var out=[];
    for(var i=0;i<list.length;i++){ if(kanaUnlocked(list,i)) out.push(list[i]); }
    return out;
  }
  function vocabDueList(){ return VOCAB.filter(function(v){ return isDue(S.vocab[v.id]); }); }

  var VOCAB_BATCH = 8;
  function buildCurriculum(){
    var nodes = [];
    for(var i=0;i<HIRAGANA.length;i+=NEW_KANA_BATCH){
      nodes.push({type:"kana", set:"hiragana", start:i, end:Math.min(i+NEW_KANA_BATCH,HIRAGANA.length), label:"Hiragana "+(Math.floor(i/NEW_KANA_BATCH)+1)});
    }
    for(var j=0;j<KATAKANA.length;j+=NEW_KANA_BATCH){
      nodes.push({type:"kana", set:"katakana", start:j, end:Math.min(j+NEW_KANA_BATCH,KATAKANA.length), label:"Katakana "+(Math.floor(j/NEW_KANA_BATCH)+1)});
    }
    for(var k=0;k<VOCAB.length;k+=VOCAB_BATCH){
      nodes.push({type:"vocab", start:k, end:Math.min(k+VOCAB_BATCH,VOCAB.length), label:"Words "+(Math.floor(k/VOCAB_BATCH)+1)});
    }
    return nodes;
  }
  var CURRICULUM = buildCurriculum();

  function nodeRaw(node){
    return node.type==="kana" ? (node.set==="hiragana"?HIRAGANA:KATAKANA).slice(node.start,node.end) : VOCAB.slice(node.start,node.end);
  }
  function nodeEntry(node, raw){ return node.type==="kana" ? S.kana[raw[0]] : S.vocab[raw.id]; }
  function nodeDone(node){
    return nodeRaw(node).every(function(r){ return isMastered(nodeEntry(node,r)); });
  }
  function nodeAttemptedAll(node){
    return nodeRaw(node).every(function(r){ var e=nodeEntry(node,r); return e && e.seen>0; });
  }
  function nodeUnlocked(nodes, idx){
    if(idx===0) return true;
    return nodeAttemptedAll(nodes[idx-1]);
  }

  function buildKanaItem(pair, pool){
    var others = pool.filter(function(p){ return p[0]!==pair[0]; }).map(function(p){ return p[1]; });
    var wrong = pick(others,3);
    var opts = shuffle(wrong.concat([pair[1]]));
    return {
      type:"kana", key: pair[0], promptJp: pair[0], answer: pair[1],
      choices: opts.map(function(o){ return {text:o, correct:o===pair[1]}; })
    };
  }
  function buildVocabItem(v, pool){
    var others = pool.filter(function(p){ return p.id!==v.id; }).map(function(p){ return p.en; });
    var wrong = pick(others,3);
    var opts = shuffle(wrong.concat([v.en]));
    return {
      type:"vocab", key: v.id, promptJp: v.jp, romaji: v.romaji, answer: v.en,
      choices: opts.map(function(o){ return {text:o, correct:o===v.en}; })
    };
  }

  function buildSession(mode, size){
    var items = [];
    if(mode==="hiragana" || mode==="mixed"){
      var due = kanaDueList(HIRAGANA);
      var unlocked = kanaUnlockedList(HIRAGANA);
      var src = due.length ? due : unlocked;
      pick(src, mode==="mixed"?Math.ceil(size/3):size).forEach(function(p){ items.push(buildKanaItem(p, unlocked)); });
    }
    if(mode==="katakana" || mode==="mixed"){
      var due2 = kanaDueList(KATAKANA);
      var unlocked2 = kanaUnlockedList(KATAKANA);
      var src2 = due2.length ? due2 : unlocked2;
      pick(src2, mode==="mixed"?Math.ceil(size/3):size).forEach(function(p){ items.push(buildKanaItem(p, unlocked2)); });
    }
    if(mode==="vocab" || mode==="mixed"){
      var due3 = vocabDueList();
      var src3 = due3.length ? due3 : VOCAB;
      pick(src3, mode==="mixed"?Math.ceil(size/3):size).forEach(function(v){ items.push(buildVocabItem(v, VOCAB)); });
    }
    return shuffle(items).slice(0,size);
  }

  function startSession(mode, size, label){
    var queue = buildSession(mode, size);
    if(queue.length===0){
      sessionState = {empty:true, label:label};
    }else{
      sessionState = {
        mode:mode, label:label, queue:queue, idx:0, correct:0,
        startXp:S.xp, answered:false
      };
    }
    view = "session";
    render();
  }

  function startChunkSession(idx){

    var pool = node.type==="kana" ? (node.set==="hiragana"?HIRAGANA:KATAKANA) : VOCAB;
    var items = nodeRaw(node).map(function(r){ return node.type==="kana" ? buildKanaItem(r,pool) : buildVocabItem(r,pool); });
    sessionState = { mode:"chunk", label:node.label, queue: shuffle(items), idx:0, correct:0, startXp:S.xp, answered:false };
    view = "session";

  function traceAfterRender(){
    var t = traceState;
    var canvas = document.getElementById("traceCanvas");
    if(!t || !canvas) return;
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height;
    var css = getComputedStyle(document.documentElement);

    function drawGuide(){
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = css.getPropertyValue("--line-strong");
      ctx.font = Math.round(h*0.62)+"px 'Yu Gothic','Hiragino Sans','Noto Sans JP','MS Gothic',sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(t.list[t.idx][0], w/2, h/2 + h*0.03);
    }
    drawGuide();
    ctx.strokeStyle = css.getPropertyValue("--accent");
    ctx.lineWidth = 12; ctx.lineCap = "round"; ctx.lineJoin = "round";

    var drawing = false, lastX = 0, lastY = 0;
    function pos(ev){
      var r = canvas.getBoundingClientRect();
      return { x: (ev.clientX-r.left)*(w/r.width), y: (ev.clientY-r.top)*(h/r.height) };
    }
    function start(ev){ drawing = true; var p = pos(ev); lastX=p.x; lastY=p.y; ev.preventDefault(); }
    function move(ev){
      if(!drawing) return;
      var p = pos(ev);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX=p.x; lastY=p.y; ev.preventDefault();
    }
    function stop(){ drawing = false; }
    canvas.onpointerdown = start;
    canvas.onpointermove = move;
    canvas.onpointerup = stop;
    canvas.onpointerleave = stop;
    canvas.onpointercancel = stop;

    document.getElementById("traceClear").onclick = function(){ drawGuide(); };
    document.getElementById("traceNext").onclick = function(){
      S.xp += 4; persist();
      chime(true);
      t.idx++;
      if(t.idx >= t.list.length){
        var n = t.list.length;
        traceState = null;
        view = "summary";
        sessionState = { kind:"trace", count:n, startXp: S.xp-4*n, label:"Writing practice" };
        render();
        if(!reduceMotion) confetti();
        return;
      }
      render();
    };
  }

  function answerChoice(choiceIdx){
    var s = sessionState;
    if(!s || s.answered) return;
    var item = s.queue[s.idx];
    var choice = item.choices[choiceIdx];
    s.answered = true;
    var good = choice.correct;
    if(good) s.correct++;
    recordAnswer(item.type==="kana"?"kana":"vocab", item.key, good);
    renderSessionFeedback(choiceIdx, good);
    setTimeout(function(){
      s.idx++;
      s.answered = false;
      if(s.idx >= s.queue.length){
        view = "summary";
      }
      render();
      if(s.idx >= s.queue.length && !reduceMotion) confetti();
    }, 700);
  }

  function applyDailyStreak(){
    var today = todayStr();
    if(S.lastActiveDate===today) return;
    var y = new Date(); y.setDate(y.getDate()-1);
    if(S.lastActiveDate===todayStr(y)) S.streak++;

    S.lastActiveDate = today;
    persist();

    root.innerHTML = html;
    root.classList.remove("view-fade");
    void root.offsetWidth;
    root.classList.add("view-fade");
    renderTabbar();
    attachHandlers();
    if(view==="talk") talkAfterRender();
    if(view==="trace") traceAfterRender();
  }

  function renderTabbar(){
    var bar = document.getElementById("tabbar");
    var tabs = [
      {id:"home", ic:"🏠", lbl:"Home"},
      {id:"learn", ic:"📖", lbl:"Learn"},
      {id:"talk", ic:"💬", lbl:"Talk"},
      {id:"progress", ic:"📊", lbl:"Stats"}
    ];
    bar.innerHTML = tabs.map(function(t){
      var active = (view===t.id) || ((view==="session"||view==="summary"||view==="trace") && t.id==="learn");
      return '<button class="navbtn'+(active?" active":"")+'" data-nav="'+t.id+'"><span class="ic">'+t.ic+"</span>"+t.lbl+"</button>";
    }).join("");
  }

  function renderPath(){
    var nodes = CURRICULUM;
    var states = nodes.map(function(n, i){
      if(!nodeUnlocked(nodes, i)) return "locked";
      if(nodeDone(n)) return "done";
      return "open";
    });
    var currentIdx = states.indexOf("open");
    if(currentIdx===-1) currentIdx = nodes.length-1;
    var startIdx = Math.max(0, currentIdx-1);
    var endIdx = Math.min(nodes.length, currentIdx+4);
    var hiddenBefore = startIdx;
    var hiddenAfter = nodes.length - endIdx;

    var rows = "";
    if(hiddenBefore>0){
      rows += '<div class="path-node-row odd"><div class="path-node done" style="width:2.6rem;height:2.6rem;font-size:1rem;opacity:0.6">✓</div>'+
        '<div class="path-node-label">'+hiddenBefore+' lesson'+(hiddenBefore===1?"":"s")+' completed</div></div>';
    }
    for(var i=startIdx;i<endIdx;i++){
      var n = nodes[i];
      var st = states[i];
      if(st==="open"){ st = (i===currentIdx) ? "current" : "available"; }
      var icon = n.type==="kana" ? esc(nodeRaw(n)[0][0]) : "語";
      var rowCls = i%2===0 ? "odd" : "even";
      var clickable = st!=="locked";
      var inner = st==="done" ? "✓" : st==="locked" ? "🔒" : '<span class="jp">'+icon+"</span>";
      rows += '<div class="path-node-row '+rowCls+'">'+
          '<button class="path-node '+st+'" '+(clickable?'data-chunk="'+i+'"':'')+'>'+inner+'</button>'+
          '<div class="path-node-label">'+esc(n.label)+(st==="current"?' <strong style="color:var(--accent)">· start here</strong>':'')+'</div>'+
        '</div>';
    }
    if(hiddenAfter>0){
      rows += '<div class="path-node-row even"><div class="path-node locked" style="width:2.6rem;height:2.6rem;font-size:0.85rem">+'+hiddenAfter+'</div>'+
        '<div class="path-node-label">more lessons ahead</div></div>';
    }
    return '<div class="path-wrap"><div class="path-line"></div><div class="path-nodes">'+rows+'</div></div>';
  }

  function renderRegions(){
    var lv = level();
    var cards = REGIONS.map(function(r){
      var unlocked = lv >= r.req;
      return '<div class="region-card'+(unlocked?"":" locked")+'" style="background:'+r.grad+'" '+(unlocked?'data-nav="learn"':'')+'>'+
        '<div class="region-mountain"></div>'+
        (unlocked?'':'<div class="region-lock">🔒</div>')+
        '<div class="region-info">'+
          '<div class="region-name">'+esc(r.name)+'</div>'+
          '<div class="region-theme">'+esc(r.theme)+'</div>'+
          '<div class="region-badge">'+(unlocked?"Explore →":"Unlocks at Lv"+r.req)+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
    return '<div class="section-label">Discover Japan</div><div class="region-scroll">'+cards+'</div>';
  }

  function homeStats(){
    var dueKanaH = kanaDueList(HIRAGANA).length;
    var dueKanaK = kanaDueList(KATAKANA).length;
    var dueVocab = vocabDueList().length;
    var masteredKana = HIRAGANA.concat(KATAKANA).filter(function(p){ return isMastered(S.kana[p[0]]); }).length;
    var masteredVocab = VOCAB.filter(function(v){ return isMastered(S.vocab[v.id]); }).length;
    return { dueKanaH:dueKanaH, dueKanaK:dueKanaK, dueVocab:dueVocab, totalDue:dueKanaH+dueKanaK+dueVocab, masteredKana:masteredKana, masteredVocab:masteredVocab };
  }

  function renderHome(){
    var st = homeStats();

    var mobile = ''+
      '<div class="home-mobile">'+
      (S.xp===0 ? '<div class="banner">Welcome! Follow the path below — tap the glowing node to start.</div>' : '')+
      '<div class="section-label">Your path</div>'+
      renderPath()+
      '<button class="btn btn-primary btn-block" data-action="start-lazy" style="margin-top:0.5rem">⚡ Lazy Mode — 5 quick cards</button>'+
      '<div class="quick-grid">'+
        '<div class="quick-tile" data-nav="learn" data-learntab="hiragana"><span class="n">'+st.masteredKana+'/92</span><span class="l">Kana</span></div>'+
        '<div class="quick-tile" data-nav="learn" data-learntab="vocab"><span class="n">'+st.masteredVocab+'/'+VOCAB.length+'</span><span class="l">Words</span></div>'+
        '<div class="quick-tile" data-nav="talk"><span class="n">💬</span><span class="l">Talk</span></div>'+
      '</div>'+
      renderRegions()+
      '</div>';

    var due = [
      {label:"Hiragana", n:st.dueKanaH, action:"practice-hiragana"},
      {label:"Katakana", n:st.dueKanaK, action:"practice-katakana"},
      {label:"Vocabulary", n:st.dueVocab, action:"practice-vocab"}
    ];
    var desktop = ''+
      '<div class="home-desktop">'+
      (S.xp===0 ? '<div class="banner">Welcome. Your first lesson is Hiragana — start with the review table below.</div>' : '')+
      '<div class="dash-grid">'+
        '<div class="dash-card"><div class="big">🔥 '+S.streak+'</div><div class="lbl">Day streak</div></div>'+
        '<div class="dash-card"><div class="big">Lv'+level()+'</div><div class="lbl">'+xpIntoLevel()+'/150 XP</div></div>'+
        '<div class="dash-card"><div class="big">'+st.masteredKana+'/92</div><div class="lbl">Kana mastered</div></div>'+
        '<div class="dash-card"><div class="big">'+st.masteredVocab+'/'+VOCAB.length+'</div><div class="lbl">Words mastered</div></div>'+
      '</div>'+
      '<div class="section-label">Due for review</div>'+
      '<table class="due-table"><tbody>'+
        due.map(function(d){
          return '<tr><td>'+d.label+'</td><td class="cnt">'+d.n+' due</td><td style="text-align:right"><button class="go" data-action="'+d.action+'">Practice</button></td></tr>';
        }).join("")+
      '</tbody></table>'+
      '<div class="stats-row" style="margin-top:1.25rem">'+
        '<button class="btn btn-primary" data-action="start-daily">Start Daily Practice (10)</button>'+
        '<button class="btn btn-ghost" data-action="start-lazy">Lazy Mode (5)</button>'+
        '<button class="btn btn-ghost" data-nav="talk">Talk practice</button>'+
      '</div>'+
      '</div>';

    return '<div class="topbar">'+
      '<div class="brand">'+mascotSvg(40)+'<h1>Nihongo Dojo</h1></div>'+
      '<div class="stats-row">'+
        '<div class="stat-pill pill-flame">🔥 '+S.streak+'</div>'+
        '<div class="stat-pill pill-xp">⭐ Lv'+level()+'</div>'+
      '</div>'+
    '</div>'+ mobile + desktop;
  }

  function kanaSectionHtml(list, setName, label){
    var actionName = "practice-"+setName;
    return '<div class="learn-section'+(learnTab===setName?" active":"")+'" data-sec="'+setName+'">'+
      '<h3 class="learn-heading">'+label+'</h3>'+
      '<div class="btn-row">'+
        '<button class="btn btn-primary" data-action="'+actionName+'">Practice</button>'+
        '<button class="btn btn-ghost" data-action="trace-'+setName+'">✏️ Trace</button>'+
      '</div>'+
      '<div class="kgrid">'+list.map(function(pair, idx){
        var unlocked = kanaUnlocked(list, idx);
        var e = S.kana[pair[0]];
        var boxCls = unlocked ? "b"+(e?e.box:0) : "";
        return '<div class="ktile '+(unlocked?boxCls:"locked")+'" '+(unlocked?'data-speak="'+esc(pair[0])+'"':'')+'>'+
          '<span class="c jp">'+(unlocked?esc(pair[0]):"🔒")+'</span>'+
          (unlocked?'<span class="r">'+esc(pair[1])+'</span>':'')+
        '</div>';
      }).join("")+'</div>'+
    '</div>';
  }

  function renderLearn(){
    var tabsHtml = ["hiragana","katakana","vocab"].map(function(t){
      var lbl = t==="hiragana"?"Hiragana":t==="katakana"?"Katakana":"Vocab";
      return '<button class="tab'+(learnTab===t?" active":"")+'" data-learntab="'+t+'">'+lbl+"</button>";
    }).join("");

    var vocabSection = '<div class="learn-section'+(learnTab==="vocab"?" active":"")+'" data-sec="vocab">'+
      '<h3 class="learn-heading">Vocabulary</h3>'+
      '<button class="btn btn-primary btn-block" data-action="practice-vocab" style="margin-bottom:1rem">Practice Vocab</button>'+
      '<div class="vlist">'+VOCAB.map(function(v){
        var e = S.vocab[v.id];
        var cls = isMastered(e) ? "mastered" : (isDue(e) ? "due" : "");
        return '<div class="vrow" data-speak="'+esc(v.jp)+'">'+
          '<div><div class="jp">'+esc(v.jp)+'</div><div class="romaji">'+esc(v.romaji)+'</div></div>'+
          '<div class="en">'+esc(v.en)+'</div>'+
          '<div class="box-dot '+cls+'"></div>'+
        '</div>';
      }).join("")+'</div>'+
    '</div>';

    return '<div class="topbar"><div class="brand"><h1>Learn</h1></div></div>'+
      '<div class="tabs">'+tabsHtml+'</div>'+
      '<div class="learn-body">'+
        '<div class="learn-col">'+
          kanaSectionHtml(HIRAGANA,"hiragana","Hiragana")+
          kanaSectionHtml(KATAKANA,"katakana","Katakana")+
        '</div>'+
        '<div class="learn-col">'+vocabSection+'</div>'+
      '</div>';
  }

  function renderSession(){
    var s = sessionState;
    if(!s || s.empty){
      return '<div class="summary">'+mascotSvg(72)+'<h2>All caught up!</h2><p class="mission-sub">Nothing due right now in this set. Try another set or come back later.</p>'+
        '<button class="btn btn-primary" data-nav="learn">Back to Learn</button></div>';
    }
    var item = s.queue[s.idx];
    var pct = Math.round((s.idx/s.queue.length)*100);
    var promptHtml = item.type==="kana"
      ? '<div class="prompt-jp jp">'+esc(item.promptJp)+'</div>'
      : '<div class="prompt-jp jp" style="font-size:2.4rem">'+esc(item.promptJp)+'</div><div class="mission-sub" style="text-align:center">'+esc(item.romaji)+'</div>';
    return ''+
    '<div class="session">'+
      '<button class="session-exit" data-nav="home">✕ Exit</button>'+
      '<div class="session-progress" style="width:100%"><div style="width:'+pct+'%"></div></div>'+
      mascotSvg(48)+
      promptHtml+
      '<button class="speak-btn" data-speak="'+esc(item.promptJp)+'">🔊</button>'+
      '<div class="choices" id="choicesWrap">'+
        item.choices.map(function(c,i){ return '<button class="choice" data-choice="'+i+'">'+esc(c.text)+"</button>"; }).join("")+
      '</div>'+
    '</div>';
  }

  function renderSessionFeedback(chosenIdx, good){
    var s = sessionState;
    var item = s.queue[s.idx];
    var btns = document.querySelectorAll("#choicesWrap .choice");
    btns.forEach(function(b,i){
      b.disabled = true;
      if(item.choices[i].correct) b.classList.add("correct");
      else if(i===chosenIdx) b.classList.add("wrong");
    });
    reactMascot(document.querySelector(".session .mascot"), good);
    chime(good);
    haptic(good ? 15 : [12,40,12]);
  }

  function renderSummary(){
    var s = sessionState;
    var earned = s ? (S.xp - s.startXp) : 0;
    var sub;
    if(s && s.kind==="trace"){
      sub = s.count+' character'+(s.count===1?"":"s")+' traced';
    }else{
      var acc = s && s.queue.length ? Math.round((s.correct/s.queue.length)*100) : 0;
      sub = (s?s.correct:0)+'/'+(s?s.queue.length:0)+' correct · '+acc+'% accuracy';
    }
    return '<div class="summary">'+mascotSvg(80)+
      '<h2>Session complete!</h2>'+
      '<div class="xp-earned">+'+earned+' XP</div>'+
      '<p class="mission-sub">'+sub+'</p>'+
      '<button class="btn btn-primary btn-block" data-nav="home">Back to Home</button>'+
    '</div>';
  }

  function renderProgress(){
    var allKana = HIRAGANA.concat(KATAKANA);
    var boxCounts = [0,0,0,0,0,0];
    allKana.forEach(function(p){ var e=S.kana[p[0]]; boxCounts[e?e.box:0]++; });
    var vBoxCounts=[0,0,0,0,0,0];
    VOCAB.forEach(function(v){ var e=S.vocab[v.id]; vBoxCounts[e?e.box:0]++; });
    var labels=["New","Learning","Learning","Reviewing","Reviewing","Mastered"];
    var colorFor = function(i){ return i<=0?"var(--line-strong)": i<3?"var(--gold)":"var(--jade)"; };

    function bars(counts, total){
      var rows = [0,3,5];
      var groups = [
        {lbl:"New", n:counts[0]},
        {lbl:"Learning", n:counts[1]+counts[2]},
        {lbl:"Reviewing", n:counts[3]+counts[4]},
        {lbl:"Mastered", n:counts[5]}
      ];
      return '<div class="barlist">'+groups.map(function(g){
        var pct = total? Math.round(g.n/total*100):0;
        return '<div class="barrow"><div class="lbl">'+g.lbl+'</div><div class="track"><div class="fill" style="width:'+pct+'%;background:'+colorFor(g.lbl==="Mastered"?5:g.lbl==="New"?0:2)+'"></div></div><div class="val">'+g.n+'</div></div>';
      }).join("")+'</div>';
    }

    return '<div class="topbar"><div class="brand"><h1>Progress</h1></div></div>'+
      '<div class="stat-block">'+
        '<div class="stat-box"><div class="big">🔥 '+S.streak+'</div><div class="lbl">Day streak</div></div>'+
        '<div class="stat-box"><div class="big">⭐ '+S.xp+'</div><div class="lbl">Total XP · Level '+level()+'</div></div>'+
      '</div>'+
      '<div class="section-label">Kana mastery ('+allKana.length+' characters)</div>'+
      bars(boxCounts, allKana.length)+
      '<div class="section-label">Vocabulary mastery ('+VOCAB.length+' words)</div>'+
      bars(vBoxCounts, VOCAB.length);
  }

  function renderTalk(){
    if(!talkState){
      talkState = {personaId:"yuki", turns:[], loading:false, error:null, started:false};
    }
    var t = talkState;
    if(!claudeSample){
      return '<div class="topbar"><div class="brand"><h1>Talk</h1></div></div>'+
        '<div class="persona-row">'+PERSONAS.map(function(p){
          return '<div class="persona-card"><div class="av">'+p.avatar+'</div><div class="nm">'+p.name+'</div><div class="rl">'+p.role+'</div></div>';
        }).join("")+'</div>'+
        '<div class="notice">AI conversation practice needs this app to be opened as a Claude artifact with Claude access allowed.</div>';
    }
    return '<div class="topbar"><div class="brand"><h1>Talk</h1></div></div>'+
      '<div class="persona-row">'+PERSONAS.map(function(p){
        return '<div class="persona-card'+(t.personaId===p.id?" active":"")+'" data-persona="'+p.id+'"><div class="av">'+p.avatar+'</div><div class="nm">'+p.name+'</div><div class="rl">'+esc(p.role)+'</div></div>';
      }).join("")+'</div>'+
      '<div class="chat-log" id="chatLog"></div>'+
      (t.error ? '<div class="banner" style="background:var(--accent-soft);border-color:var(--accent)">'+esc(t.error)+'</div>' : '')+
      '<form class="chat-form" id="chatForm">'+
        '<input class="chat-input" id="chatInput" placeholder="Type in English or Japanese…" autocomplete="off" '+(t.loading?"disabled":"")+'>'+
        '<button class="chat-send" type="submit" '+(t.loading?"disabled":"")+'>➤</button>'+
      '</form>';
  }

  function personaInstruction(persona){
    return "You are "+persona.name+", a "+persona.role+" inside a Japanese conversation-practice app. "+
      "Personality: "+persona.style+". The learner is a complete beginner (knows some hiragana and basic words). "+
      "Rules: reply mostly in very simple Japanese (N5 level, short sentences). After each Japanese sentence, add the romaji in parentheses and a short English translation in square brackets. "+
      "Keep replies to 2-4 short sentences total. If the learner's message has a Japanese mistake, gently show the corrected form first, then continue naturally. "+
      "Stay in character the whole time and end your reply with a simple follow-up question to keep the conversation going. "+
      "Begin the conversation now with a short in-character greeting.";
  }

  function talkAfterRender(){
    if(!claudeSample) return;
    var log = document.getElementById("chatLog");
    var t = talkState;
    log.innerHTML = t.turns.map(function(m){
      return '<div class="bubble '+(m.role==="user"?"me":"them")+'">'+esc(m.content)+'</div>';
    }).join("");
    log.scrollTop = log.scrollHeight;
    if(!t.started){
      t.started = true;
      startConversation();
    }
    var form = document.getElementById("chatForm");
    if(form){
      form.onsubmit = function(ev){
        ev.preventDefault();
        var input = document.getElementById("chatInput");
        var val = input.value.trim();
        if(!val || t.loading) return;
        input.value = "";
        sendTalkMessage(val);
      };
    }
  }

  function appendBubble(role, text){
    var log = document.getElementById("chatLog");
    var div = document.createElement("div");
    div.className = "bubble "+(role==="user"?"me":"them");
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function startConversation(){
    var t = talkState;
    var persona = PERSONAS.filter(function(p){return p.id===t.personaId;})[0];
    t.loading = true;
    var bubble = appendBubble("assistant", "…thinking…");
    claudeSample([{role:"user", content: personaInstruction(persona)}], {
      cache:false,
      onText:function(u){ bubble.textContent = u.text; document.getElementById("chatLog").scrollTop = 999999; }
    }).then(function(res){
      t.turns.push({role:"assistant", content: res.text});
      t.loading = false;
      render();
    }).catch(function(err){
      t.loading = false;
      t.error = talkErrorMessage(err);
      bubble.remove();
      render();
    });
  }

  function sendTalkMessage(text){
    var t = talkState;
    var persona = PERSONAS.filter(function(p){return p.id===t.personaId;})[0];
    t.turns.push({role:"user", content:text});
    t.error = null;
    t.loading = true;
    appendBubble("user", text);
    var bubble = appendBubble("assistant", "…thinking…");
    var msgs = [{role:"user", content: personaInstruction(persona)}].concat(t.turns);
    claudeSample(msgs, {
      cache:false,
      onText:function(u){ bubble.textContent = u.text; document.getElementById("chatLog").scrollTop = 999999; }
    }).then(function(res){
      t.turns.push({role:"assistant", content: res.text});
      t.loading = false;
      S.xp += 5;
      persist();
      render();
    }).catch(function(err){
      t.loading = false;
      t.error = talkErrorMessage(err);
      bubble.remove();
      render();
    });
  }

  function talkErrorMessage(err){
    var code = err && err.code;
    if(code==="not_granted") return "Claude access was declined for this app. Allow it to chat with "+ (PERSONAS.filter(function(p){return p.id===talkState.personaId;})[0]||{}).name+".";
    if(code==="rate_limited") return "Too many messages right now — wait a moment and try again.";
    if(code==="session_expired") return "Please sign in again to continue chatting.";
    return "Something went wrong. Try sending that again.";
  }

  function switchPersona(id){
    talkState = {personaId:id, turns:[], loading:false, error:null, started:false};
    render();
  }

  // ---------------- events ----------------

  function attachHandlers(){
    var root = document.getElementById("app");
    root.addEventListener("click", onRootClick);
    document.getElementById("tabbar").addEventListener("click", onRootClick);
  }

  function onRootClick(ev){
    var el = ev.target.closest("[data-nav],[data-action],[data-speak],[data-choice],[data-learntab],[data-persona],[data-chunk]");
    if(!el) return;
    if(el.dataset.chunk!=null){ startChunkSession(parseInt(el.dataset.chunk,10)); return; }
    if(el.dataset.speak){ speak(el.dataset.speak); if(!el.dataset.nav && !el.dataset.action && !el.dataset.learntab) return; }
    if(el.dataset.choice!=null){ answerChoice(parseInt(el.dataset.choice,10)); return; }
    if(el.dataset.persona){ switchPersona(el.dataset.persona); return; }
    if(el.dataset.learntab){ learnTab = el.dataset.learntab; view="learn"; render(); return; }
    if(el.dataset.action==="start-daily"){ startSession("mixed", 10, "Daily Practice"); return; }
    if(el.dataset.action==="start-lazy"){ startSession("mixed", 5, "Lazy Mode"); return; }
    if(el.dataset.action==="practice-hiragana"){ startSession("hiragana", 10, "Hiragana"); return; }
    if(el.dataset.action==="practice-katakana"){ startSession("katakana", 10, "Katakana"); return; }
    if(el.dataset.action==="practice-vocab"){ startSession("vocab", 10, "Vocabulary"); return; }
    if(el.dataset.action==="trace-hiragana"){ startTrace("hiragana"); return; }
    if(el.dataset.action==="trace-katakana"){ startTrace("katakana"); return; }
    if(el.dataset.nav){ setView(el.dataset.nav); return; }
  }

  function applyTheme(t){
    if(t==="light") document.documentElement.setAttribute("data-theme","light");
    else if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme");
    var btn = document.getElementById("themeToggle");
    if(btn) btn.textContent = t==="dark" ? "🌙" : "☀️";
  }
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem("nihongo_theme"); }catch(e){}
    applyTheme(saved || "light");
    var btn = document.getElementById("themeToggle");
    if(btn){
      btn.addEventListener("click", function(){
        var current = document.documentElement.getAttribute("data-theme") || "light";
        var next = current==="dark" ? "light" : "dark";
        applyTheme(next);
        try{ localStorage.setItem("nihongo_theme", next); }catch(e){}
      });
    }
  }
  initTheme();

  initCapabilities().then(loadState).then(function(){
    applyDailyStreak();
    render();
  });
})();
</script>
