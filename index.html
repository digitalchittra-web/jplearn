<title>Nihongo Dojo</title>
<style>
  :root{
    --bg: #fdfaf4;
    --surface: #ffffff;
    --surface-alt: #f6f1e6;
    --ink: #2b2318;
    --ink-soft: #8a7f6a;
    --accent: #ff5a3c;
    --accent-soft: #ff5a3c17;
    --gold: #e69a0d;
    --gold-soft: #e69a0d1a;
    --jade: #16b384;
    --jade-soft: #16b3841a;
    --indigo: #4f5fd6;
    --indigo-soft: #4f5fd61a;
    --line: #f0e8d6;
    --line-strong: #e3d6b8;
    --shadow-sm: 0 1px 2px rgba(60,42,10,0.05), 0 10px 24px -16px rgba(60,42,10,0.22);
    --shadow-md: 0 2px 4px rgba(60,42,10,0.06), 0 16px 36px -18px rgba(60,42,10,0.28);
    --shadow-lg: 0 4px 8px rgba(60,42,10,0.08), 0 28px 60px -24px rgba(60,42,10,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1c1811;
      --surface: #272119;
      --surface-alt: #322a1f;
      --ink: #f6efe1;
      --ink-soft: #b8ab90;
      --accent: #ff8266;
      --accent-soft: #ff826626;
      --gold: #ffc24d;
      --gold-soft: #ffc24d26;
      --jade: #3ce0ac;
      --jade-soft: #3ce0ac26;
      --indigo: #93a0ff;
      --indigo-soft: #93a0ff26;
      --line: #3c3324;
      --line-strong: #4f4430;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -16px rgba(0,0,0,0.5);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.32), 0 16px 36px -18px rgba(0,0,0,0.55);
      --shadow-lg: 0 4px 8px rgba(0,0,0,0.35), 0 28px 60px -24px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg: #1c1811;
    --surface: #272119;
    --surface-alt: #322a1f;
    --ink: #f6efe1;
    --ink-soft: #b8ab90;
    --accent: #ff8266;
    --accent-soft: #ff826626;
    --gold: #ffc24d;
    --gold-soft: #ffc24d26;
    --jade: #3ce0ac;
    --jade-soft: #3ce0ac26;
    --indigo: #93a0ff;
    --indigo-soft: #93a0ff26;
    --line: #3c3324;
    --line-strong: #4f4430;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -16px rgba(0,0,0,0.5);
    --shadow-md: 0 2px 4px rgba(0,0,0,0.32), 0 16px 36px -18px rgba(0,0,0,0.55);
    --shadow-lg: 0 4px 8px rgba(0,0,0,0.35), 0 28px 60px -24px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
    padding-bottom: calc(5.25rem + env(safe-area-inset-bottom));
  }
  h1,h2,h3{ font-family: inherit; text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-weight: 800; }
  .jp{ font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", "MS Gothic", sans-serif; }
  button{ font-family: inherit; color: inherit; }
  :focus-visible{ outline: 3px solid var(--accent); outline-offset: 2px; }

  #app{ max-width: 34rem; margin: 0 auto; padding: 0 1rem; }
  #app.view-fade{ animation: viewIn 0.28s cubic-bezier(.22,1,.36,1) both; }
  @keyframes viewIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:none; } }

  @keyframes idleBreathe{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.045); } }
  .mascot{ animation: idleBreathe 3.4s ease-in-out infinite; flex-shrink: 0; }
  .mascot.bounce{ animation: bounce 0.5s cubic-bezier(.34,1.56,.64,1); }
  .mascot.shake{ animation: shake 0.4s ease; }
  @keyframes bounce{ 0%{transform:scale(1)} 40%{transform:scale(1.2) rotate(-5deg)} 100%{transform:scale(1)} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px) rotate(-3deg)} 75%{transform:translateX(7px) rotate(3deg)} }
  @media (prefers-reduced-motion: reduce){
    .mascot, .mascot.bounce, .mascot.shake, #app.view-fade{ animation: none !important; }
  }

  /* ---------- app header ---------- */
  .appbar{
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .appbar-inner{
    max-width: 34rem; margin: 0 auto;
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 1rem;
  }
  .appbar .title{ font-size: 1.05rem; font-weight: 800; margin-right: auto; }
  .chip{
    display: inline-flex; align-items: center; gap: 0.3rem;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 0.35rem 0.7rem;
    font-size: 0.85rem; font-weight: 800; font-variant-numeric: tabular-nums;
    box-shadow: var(--shadow-sm);
  }
  .chip.flame{ color: var(--accent); }
  .chip.gem{ color: var(--gold); }
  .icon-btn{
    width: 2.4rem; height: 2.4rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 1.05rem; cursor: pointer; display: grid; place-items: center;
    box-shadow: var(--shadow-sm); flex-shrink: 0;
  }

  .section-label{
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 800; margin: 1.6rem 0 0.7rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-label .tag{
    font-size: 0.6rem; letter-spacing: 0.06em; background: var(--surface-alt);
    border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.5rem; color: var(--ink-soft);
  }

  /* ---------- buttons ---------- */
  .btn{
    border: none; border-radius: 16px; padding: 0 1.2rem;
    min-height: 3.25rem; font-weight: 800; font-size: 1rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  }
  .btn-primary{ background: var(--accent); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 62%, #000); }
  .btn-primary:active{ box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 62%, #000); transform: translateY(3px); }
  .btn-ghost{ background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); box-shadow: var(--shadow-sm); }
  .btn-block{ width: 100%; }
  .btn-row{ display: flex; gap: 0.6rem; width: 100%; margin-bottom: 1rem; }
  .btn-row .btn{ flex: 1; }

  /* ---------- hero continue ---------- */
  .hero{
    position: relative; overflow: hidden;
    border-radius: 26px; padding: 1.35rem;
    background: linear-gradient(150deg, var(--accent), var(--gold));
    color: #fff; box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; gap: 0.9rem;
  }
  .hero::after{
    content:""; position: absolute; right: -2.5rem; top: -2.5rem;
    width: 11rem; height: 11rem; border-radius: 50%;
    background: rgba(255,255,255,0.14);
  }
  .hero-eyebrow{ font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 800; opacity: 0.92; }
  .hero-title{ font-size: 1.5rem; font-weight: 800; line-height: 1.15; }
  .hero-sub{ font-size: 0.9rem; opacity: 0.95; }
  .hero-bar{ height: 8px; border-radius: 999px; background: rgba(255,255,255,0.3); overflow: hidden; }
  .hero-bar > div{ height: 100%; background: #fff; border-radius: 999px; transition: width .4s ease; }
  .hero .btn{ background: #fff; color: var(--accent); box-shadow: 0 4px 0 rgba(0,0,0,0.13); position: relative; z-index: 1; }
  .hero .btn:active{ box-shadow: 0 1px 0 rgba(0,0,0,0.13); transform: translateY(3px); }

  /* ---------- phrase card ---------- */
  .phrase-card{
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    padding: 1.15rem; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 0.35rem;
  }
  .phrase-top{ display: flex; align-items: flex-start; gap: 0.75rem; }
  .phrase-jp{ font-size: 1.7rem; font-weight: 800; line-height: 1.25; flex: 1; }
  .phrase-romaji{ color: var(--ink-soft); font-size: 0.9rem; }
  .phrase-en{ font-weight: 700; margin-top: 0.3rem; }
  .phrase-when{
    margin-top: 0.6rem; font-size: 0.8rem; color: var(--ink-soft);
    background: var(--surface-alt); border-radius: 12px; padding: 0.5rem 0.7rem;
  }
  .speak-btn{
    border: 1px solid var(--line); background: var(--surface-alt); border-radius: 50%;
    width: 2.9rem; height: 2.9rem; min-width: 2.9rem; cursor: pointer; font-size: 1.15rem;
    display: grid; place-items: center; box-shadow: var(--shadow-sm);
  }

  /* ---------- action chips ---------- */
  .action-row{
    display: flex; gap: 0.6rem; overflow-x: auto; padding: 0.25rem 1rem 0.5rem;
    margin: 0 -1rem; scrollbar-width: none;
  }
  .action-row::-webkit-scrollbar{ display: none; }
  .action{
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem;
    min-width: 5.4rem; min-height: 5.4rem; padding: 0.7rem 0.6rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow-sm); cursor: pointer; font-weight: 800; font-size: 0.75rem;
  }
  .action .ic{ font-size: 1.5rem; }
  .action .sub{ font-size: 0.65rem; color: var(--ink-soft); font-weight: 600; }

  /* ---------- lesson path ---------- */
  .path-wrap{ position: relative; padding: 0.5rem 0; }
  .path-line{
    position: absolute; left: 50%; top: 1rem; bottom: 1rem; width: 4px; margin-left: -2px;
    background: repeating-linear-gradient(var(--line-strong) 0 8px, transparent 8px 18px);
  }
  .path-nodes{ position: relative; display: flex; flex-direction: column; gap: 1.15rem; align-items: center; }
  .path-node-row{ display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
  .path-node-row.odd{ transform: translateX(-2.6rem); }
  .path-node-row.even{ transform: translateX(2.6rem); }
  .path-node{
    width: 4.4rem; height: 4.4rem; border-radius: 50%; border: none; cursor: pointer;
    display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.16);
  }
  .path-node:active{ transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.16); }
  .path-node.locked{ background: var(--line-strong); color: var(--ink-soft); cursor: default; box-shadow: none; }
  .path-node.locked:active{ transform: none; }
  .path-node.available{ background: var(--indigo); }
  .path-node.done{ background: var(--jade); }
  .path-node.current{ background: var(--accent); animation: pulseRing 1.9s ease-in-out infinite; }
  @keyframes pulseRing{
    0%,100%{ box-shadow: 0 5px 0 rgba(0,0,0,0.16), 0 0 0 0 var(--accent-soft); }
    50%{ box-shadow: 0 5px 0 rgba(0,0,0,0.16), 0 0 0 12px transparent; }
  }
  @media (prefers-reduced-motion: reduce){ .path-node.current{ animation: none; } }
  .path-node-label{ font-size: 0.75rem; font-weight: 800; color: var(--ink-soft); text-align: center; max-width: 7rem; }

  /* ---------- region carousel ---------- */
  .region-scroll{
    display: flex; gap: 0.85rem; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 0.15rem 1rem 0.6rem; margin: 0 -1rem; scrollbar-width: none;
  }
  .region-scroll::-webkit-scrollbar{ display: none; }
  .region-card{
    position: relative; flex: 0 0 9.5rem; height: 12rem; border-radius: 22px; overflow: hidden;
    scroll-snap-align: start; color: #fff; box-shadow: var(--shadow-md); cursor: pointer;
  }
  .region-card.locked{ filter: saturate(0.4) brightness(0.8); cursor: default; }
  .region-mountain{
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 78%; height: 52%; background: rgba(255,255,255,0.22);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }
  .region-lock{ position: absolute; top: 0.6rem; right: 0.7rem; font-size: 1rem; }
  .region-info{
    position: absolute; inset: auto 0 0 0; padding: 0.8rem;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent 85%);
  }
  .region-name{ font-weight: 800; font-size: 1rem; }
  .region-theme{ font-size: 0.68rem; opacity: 0.92; margin-top: 0.15rem; line-height: 1.3; }
  .region-badge{ font-size: 0.64rem; font-weight: 800; margin-top: 0.45rem; }

  /* ---------- segmented control ---------- */
  .segmented{
    display: flex; gap: 0.2rem; background: var(--surface-alt);
    border: 1px solid var(--line); border-radius: 14px; padding: 0.25rem; margin: 0.9rem 0 1.1rem;
  }
  .segmented button{
    flex: 1; border: none; background: none; border-radius: 11px;
    padding: 0.6rem 0.35rem; font-weight: 800; font-size: 0.82rem; cursor: pointer; color: var(--ink-soft);
  }
  .segmented button.active{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

  /* ---------- kana grid ---------- */
  .kgrid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(4.3rem,1fr)); gap: 0.55rem; }
  .ktile{
    aspect-ratio: 1; border-radius: 18px; border: 1px solid var(--line); background: var(--surface);
    display: grid; place-content: center; justify-items: center; gap: 0.1rem;
    cursor: pointer; box-shadow: var(--shadow-sm);
  }
  .ktile .c{ font-size: 1.55rem; font-weight: 800; }
  .ktile .r{ font-size: 0.66rem; color: var(--ink-soft); font-weight: 700; }
  .ktile.locked{ opacity: 0.35; cursor: default; box-shadow: none; }
  .ktile.b1,.ktile.b2{ box-shadow: inset 0 0 0 2px var(--gold); background: var(--gold-soft); }
  .ktile.b3,.ktile.b4{ box-shadow: inset 0 0 0 2px var(--jade); background: var(--jade-soft); }
  .ktile.b5{ background: var(--jade); }
  .ktile.b5 .c, .ktile.b5 .r{ color: #fff; }

  /* ---------- lists ---------- */
  .vlist{ display: flex; flex-direction: column; gap: 0.55rem; }
  .vrow{
    display: flex; align-items: center; gap: 0.8rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 0.85rem 1rem; cursor: pointer; box-shadow: var(--shadow-sm); min-height: 3.75rem;
  }
  .vrow .jp{ font-size: 1.2rem; font-weight: 800; }
  .vrow .romaji{ color: var(--ink-soft); font-size: 0.78rem; }
  .vrow .en{ color: var(--ink-soft); font-size: 0.86rem; text-align: right; margin-left: auto; }
  .box-dot{ width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
  .box-dot.due{ background: var(--accent); }
  .box-dot.mastered{ background: var(--jade); }

  .plist{ display: flex; flex-direction: column; gap: 0.6rem; }
  .prow{
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 0.9rem 1rem; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 0.8rem; cursor: pointer;
  }
  .prow .jp{ font-size: 1.1rem; font-weight: 800; }
  .prow .meta{ flex: 1; min-width: 0; }
  .prow .en{ font-size: 0.85rem; color: var(--ink-soft); }
  .prow .sit{ font-size: 0.68rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; margin-bottom: 0.15rem; }

  /* ---------- session ---------- */
  .session{
    display: flex; flex-direction: column; align-items: center; gap: 1.1rem;
    min-height: calc(100dvh - 9rem); padding-top: 0.75rem;
  }
  .session-top{ display: flex; align-items: center; gap: 0.75rem; width: 100%; }
  .session-exit{ background: none; border: none; color: var(--ink-soft); font-size: 1.3rem; cursor: pointer; padding: 0.25rem; line-height: 1; }
  .session-progress{ flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .session-progress > div{ height: 100%; background: var(--jade); border-radius: 999px; transition: width .35s ease; }
  .prompt-jp{ font-size: 4rem; font-weight: 800; text-align: center; line-height: 1.1; }
  .prompt-sub{ color: var(--ink-soft); text-align: center; font-size: 0.95rem; }
  .session-spacer{ flex: 1; }
  .choices{ display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; width: 100%; padding-bottom: 0.5rem; }
  .choice{
    border: 1px solid var(--line-strong); background: var(--surface); border-radius: 18px;
    padding: 1.1rem 0.6rem; font-size: 1.05rem; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 0 var(--line-strong); min-height: 4rem;
  }
  .choice:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--line-strong); }
  .choice.correct{ background: var(--jade-soft); border-color: var(--jade); color: var(--jade); box-shadow: 0 4px 0 var(--jade); }
  .choice.wrong{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: 0 4px 0 var(--accent); }
  .choice[disabled]{ cursor: default; }

  .summary{ text-align: center; padding-top: 2.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .summary .xp-earned{ font-size: 2.6rem; font-weight: 800; color: var(--gold); }

  /* ---------- trace ---------- */
  .trace-canvas{
    width: 100%; max-width: 19rem; aspect-ratio: 1;
    background: var(--surface); border: 2px dashed var(--line-strong); border-radius: 24px;
    touch-action: none; box-shadow: var(--shadow-sm); cursor: crosshair;
  }

  /* ---------- swipe deck ---------- */
  .swipe-stack{ width: 100%; max-width: 19rem; height: 16rem; perspective: 1400px; }
  .swipe-card{ width: 100%; height: 100%; cursor: pointer; touch-action: pan-y; }
  .swipe-card-inner{ position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.22,1,.36,1); }
  .swipe-card.flipped .swipe-card-inner{ transform: rotateY(180deg); }
  .swipe-card-face{
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 24px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem;
    text-align: center; padding: 1.5rem;
  }
  .swipe-card-face.back{ transform: rotateY(180deg); }
  .swipe-hint{ margin-top: 0.9rem; font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; }

  /* ---------- bottom sheet ---------- */
  .sheet-backdrop{
    position: fixed; inset: 0; background: rgba(0,0,0,0.42); z-index: 60;
    animation: fadeIn .2s ease both;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .sheet{
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
    background: var(--surface); border-radius: 26px 26px 0 0;
    padding: 0.75rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-lg); animation: sheetUp .3s cubic-bezier(.22,1,.36,1) both;
    max-width: 34rem; margin: 0 auto;
  }
  @keyframes sheetUp{ from{ transform: translateY(100%); } to{ transform: none; } }
  @media (prefers-reduced-motion: reduce){
    .sheet, .sheet-backdrop{ animation: none; }
  }
  .sheet-grab{ width: 2.6rem; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 0 auto 1rem; }
  .sheet-kana{ font-size: 4.5rem; font-weight: 800; text-align: center; line-height: 1; }
  .sheet-romaji{ text-align: center; color: var(--ink-soft); font-size: 1.1rem; font-weight: 700; margin-top: 0.3rem; }
  .sheet-mnemonic{
    background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 16px;
    padding: 0.85rem 1rem; margin: 1.1rem 0; font-size: 0.92rem;
  }
  .sheet-mnemonic b{ color: var(--gold); display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.25rem; }

  /* ---------- talk ---------- */
  .persona-row{ display: flex; gap: 0.6rem; margin-bottom: 1rem; }
  .persona-card{
    flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 18px;
    padding: 0.8rem 0.5rem; text-align: center; cursor: pointer; box-shadow: var(--shadow-sm);
  }
  .persona-card.active{ border-color: var(--indigo); background: var(--indigo-soft); }
  .persona-card .av{ font-size: 1.6rem; }
  .persona-card .nm{ font-weight: 800; font-size: 0.85rem; }
  .persona-card .rl{ font-size: 0.68rem; color: var(--ink-soft); }
  .chat-log{ display: flex; flex-direction: column; gap: 0.6rem; min-height: 15rem; margin-bottom: 0.8rem; }
  .bubble{ max-width: 84%; padding: 0.75rem 0.95rem; border-radius: 18px; font-size: 0.95rem; white-space: pre-wrap; }
  .bubble.them{ background: var(--surface); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 5px; box-shadow: var(--shadow-sm); }
  .bubble.me{ background: var(--indigo); color: #fff; align-self: flex-end; border-bottom-right-radius: 5px; }
  .chat-form{ display: flex; gap: 0.5rem; position: sticky; bottom: calc(5rem + env(safe-area-inset-bottom)); }
  .chat-input{

      '<path d="M42 70 Q50 78 58 70" stroke="var(--surface)" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
      "</svg>";
  }

  function persist(){
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function(){
      if(stateRef){ stateRef.set(S).catch(function(){}); }
      else { try{ localStorage.setItem("nihongo_dojo_state", JSON.stringify(S)); }catch(e){} }
    }, 350);
  }

  function recordAnswer(store, key, correct){
    var e = S[store][key] || {box:0, seen:0, correct:0, due:0};
    e.seen++;
    if(correct) e.correct++;
    e.box = correct ? Math.min(5, e.box+1) : 0;
    var days = INTERVAL_DAYS[e.box]!=null ? INTERVAL_DAYS[e.box] : 16;
    e.due = Date.now()+days*86400000;
    S[store][key] = e;
    S.xp += correct ? 10 : 3;
    persist();
  }

  function kanaUnlocked(list, idx){
    if(idx < NEW_KANA_BATCH) return true;
    var cutoff = Math.floor(idx/NEW_KANA_BATCH)*NEW_KANA_BATCH;
    for(var i=cutoff-NEW_KANA_BATCH;i<cutoff;i++){
      var e = S.kana[list[i][0]];
      if(!e || e.box<1) return false;
    }
    return true;
  }
  function kanaDueList(list){
    return list.filter(function(p,i){ return kanaUnlocked(list,i) && isDue(S.kana[p[0]]); });
  }
  function kanaUnlockedList(list){
    return list.filter(function(p,i){ return kanaUnlocked(list,i); });
  }
  function vocabDueList(){ return VOCAB.filter(function(v){ return isDue(S.vocab[v.id]); }); }

  function buildCurriculum(){
    var hira=[], kata=[], vocab=[];
    for(var i=0;i<HIRAGANA.length;i+=NEW_KANA_BATCH)
      hira.push({type:"kana",set:"hiragana",start:i,end:Math.min(i+NEW_KANA_BATCH,HIRAGANA.length),label:"Hiragana "+(i/NEW_KANA_BATCH+1)});
    for(var j=0;j<KATAKANA.length;j+=NEW_KANA_BATCH)
      kata.push({type:"kana",set:"katakana",start:j,end:Math.min(j+NEW_KANA_BATCH,KATAKANA.length),label:"Katakana "+(j/NEW_KANA_BATCH+1)});
    for(var k=0;k<VOCAB.length;k+=VOCAB_BATCH)
      vocab.push({type:"vocab",start:k,end:Math.min(k+VOCAB_BATCH,VOCAB.length),label:"Words "+(k/VOCAB_BATCH+1)});
    // Words first, then interleave so real meanings appear early and often.
    var kana = hira.concat(kata), nodes = [], since = 0;
    if(vocab.length) nodes.push(vocab.shift());
    while(kana.length || vocab.length){
      if(kana.length){ nodes.push(kana.shift()); since++; }
      if(vocab.length && since>=3){ nodes.push(vocab.shift()); since=0; }
    }
    return nodes;
  }
  var CURRICULUM = buildCurriculum();

  function nodeRaw(n){
    return n.type==="kana" ? (n.set==="hiragana"?HIRAGANA:KATAKANA).slice(n.start,n.end) : VOCAB.slice(n.start,n.end);
  }
  function nodeEntry(n, raw){ return n.type==="kana" ? S.kana[raw[0]] : S.vocab[raw.id]; }
  function nodeDone(n){ return nodeRaw(n).every(function(r){ return isMastered(nodeEntry(n,r)); }); }
  function nodeAttemptedAll(n){ return nodeRaw(n).every(function(r){ var e=nodeEntry(n,r); return e && e.seen>0; }); }
  function nodeUnlocked(nodes, i){ return i===0 || nodeAttemptedAll(nodes[i-1]); }
  function nodeProgress(n){
    var raw = nodeRaw(n), done = raw.filter(function(r){ var e=nodeEntry(n,r); return e && e.seen>0; }).length;
    return Math.round(done/raw.length*100);
  }

  function buildKanaItem(pair, pool){
    var wrong = pick(pool.filter(function(p){ return p[0]!==pair[0]; }).map(function(p){ return p[1]; }),3);
    return { type:"kana", key:pair[0], promptJp:pair[0], sub:"", answer:pair[1],
      choices: shuffle(wrong.concat([pair[1]])).map(function(o){ return {text:o, correct:o===pair[1]}; }) };
  }
  function buildVocabItem(v, pool){
    var wrong = pick(pool.filter(function(p){ return p.id!==v.id; }).map(function(p){ return p.en; }),3);
    return { type:"vocab", key:v.id, promptJp:v.jp, sub:v.romaji, answer:v.en,
      choices: shuffle(wrong.concat([v.en])).map(function(o){ return {text:o, correct:o===v.en}; }) };
  }

  function buildSession(mode, size){
    var items = [];
    function addKana(list, n){
      var due = kanaDueList(list), unlocked = kanaUnlockedList(list);
      pick(due.length?due:unlocked, n).forEach(function(p){ items.push(buildKanaItem(p, unlocked)); });
    }
    if(mode==="hiragana"||mode==="mixed") addKana(HIRAGANA, mode==="mixed"?Math.ceil(size/3):size);
    if(mode==="katakana"||mode==="mixed") addKana(KATAKANA, mode==="mixed"?Math.ceil(size/3):size);
    if(mode==="vocab"||mode==="mixed"){
      var due = vocabDueList();
      pick(due.length?due:VOCAB, mode==="mixed"?Math.ceil(size/3):size).forEach(function(v){ items.push(buildVocabItem(v, VOCAB)); });
    }
    return shuffle(items).slice(0,size);
  }

  function startSession(mode, size, label){
    var queue = buildSession(mode, size);
    sessionState = queue.length
      ? { mode:mode, label:label, queue:queue, idx:0, correct:0, startXp:S.xp, answered:false }
      : { empty:true, label:label };
    view = "session"; render();
  }

  function startChunkSession(idx){
    var n = CURRICULUM[idx]; if(!n) return;
    var pool = n.type==="kana" ? (n.set==="hiragana"?HIRAGANA:KATAKANA) : VOCAB;
    var items = nodeRaw(n).map(function(r){ return n.type==="kana" ? buildKanaItem(r,pool) : buildVocabItem(r,pool); });
    sessionState = { mode:"chunk", label:n.label, queue:shuffle(items), idx:0, correct:0, startXp:S.xp, answered:false };
    view = "session"; render();
  }

  function answerChoice(i){
    var s = sessionState;
    if(!s || s.answered) return;
    var item = s.queue[s.idx], good = item.choices[i].correct;
    s.answered = true;
    if(good) s.correct++;
    recordAnswer(item.type==="kana"?"kana":"vocab", item.key, good);
    var btns = document.querySelectorAll("#choicesWrap .choice");
    Array.prototype.forEach.call(btns, function(b,j){
      b.disabled = true;
      if(item.choices[j].correct) b.classList.add("correct");
      else if(j===i) b.classList.add("wrong");
    });
    reactMascot(document.querySelector(".session .mascot"), good);
    chime(good); haptic(good?15:[12,40,12]);
    setTimeout(function(){
      s.idx++; s.answered=false;
      if(s.idx>=s.queue.length){ view="summary"; }
      render();
      if(s.idx>=s.queue.length && !reduceMotion) confetti();
    }, 700);
  }

  // ---------------- trace ----------------
  function startTrace(setName){
    var list = setName==="hiragana"?HIRAGANA:KATAKANA;
    var pool = kanaUnlockedList(list);
    if(!pool.length) pool = list.slice(0,5);
    traceState = { list:pick(pool,Math.min(8,pool.length)), idx:0 };

    var t = traceState;

    var pair = t.list[t.idx];
    return '<div class="session">'+

      '<canvas id="traceCanvas" width="300" height="300" class="trace-canvas"></canvas>'+

      '<div class="session-spacer"></div>'+

      '</div></div>';
  }
  function traceAfterRender(){
    var t = traceState, canvas = document.getElementById("traceCanvas");
    if(!t || !canvas) return;
    var ctx = canvas.getContext("2d"), w=canvas.width, h=canvas.height;
    var css = getComputedStyle(document.documentElement);
    function drawGuide(){
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = css.getPropertyValue("--line-strong");
      ctx.font = Math.round(h*0.62)+"px 'Yu Gothic','Hiragino Sans','Noto Sans JP','MS Gothic',sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(t.list[t.idx][0], w/2, h/2+h*0.03);
    }
    drawGuide();
    ctx.strokeStyle = css.getPropertyValue("--accent");
    ctx.lineWidth=12; ctx.lineCap="round"; ctx.lineJoin="round";
    var drawing=false, lx=0, ly=0;
    function pos(ev){ var r=canvas.getBoundingClientRect(); return {x:(ev.clientX-r.left)*(w/r.width), y:(ev.clientY-r.top)*(h/r.height)}; }
    canvas.onpointerdown = function(ev){ drawing=true; var p=pos(ev); lx=p.x; ly=p.y; ev.preventDefault(); };
    canvas.onpointermove = function(ev){
      if(!drawing) return;
      var p=pos(ev);
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
      lx=p.x; ly=p.y; ev.preventDefault();
    };
    canvas.onpointerup = canvas.onpointerleave = canvas.onpointercancel = function(){ drawing=false; };
    document.getElementById("traceClear").onclick = drawGuide;
    document.getElementById("traceNext").onclick = function(){
      S.xp += 4; persist(); chime(true); haptic(15);
      t.idx++;
      if(t.idx>=t.list.length){
        var n=t.list.length;
        traceState=null; view="summary";
        sessionState={ kind:"trace", count:n, startXp:S.xp-4*n, label:"Writing practice" };
        render(); if(!reduceMotion) confetti(); return;
      }
      render();
    };
  }

  function swipeAfterRender(){
    var s = swipeState, card = document.getElementById("swipeCard");
    if(!s || s.empty || !card) return;
    function setFlip(v){ s.flipped=v; card.classList.toggle("flipped", v); }
    card.onclick = function(){ if(!s.flipped) setFlip(true); };
    var startX=0, dx=0, dragging=false;
    card.onpointerdown = function(ev){
      if(!s.flipped) return;
      dragging=true; startX=ev.clientX; dx=0; card.style.transition="none";
      if(card.setPointerCapture){ try{ card.setPointerCapture(ev.pointerId); }catch(e){} }
    };
    card.onpointermove = function(ev){
      if(!dragging) return;
      dx = ev.clientX-startX;
      card.style.transform = "translateX("+dx+"px) rotate("+(dx/18)+"deg)";
    };
    card.onpointerup = card.onpointercancel = function(){
      if(!dragging) return;
      dragging=false; card.style.transition="";
      if(Math.abs(dx)>90) commit(dx>0); else card.style.transform="";
    };
    function commit(good){
      recordAnswer("vocab", s.queue[s.idx].id, good);
      if(good) s.correct++;
      chime(good); haptic(good?15:[12,40,12]);
      card.style.transform = "translateX("+(good?620:-620)+"px) rotate("+(good?28:-28)+"deg)";
      card.style.opacity = "0";
      setTimeout(function(){
        s.idx++;
        if(s.idx>=s.queue.length){
          view="summary";
          sessionState = { queue:s.queue, correct:s.correct, startXp:s.startXp, label:"Vocabulary" };
          swipeState=null; render();
          if(!reduceMotion) confetti();
          return;
        }
        s.flipped=false; render();
      },220);
    }
    document.getElementById("swipeYes").onclick = function(){ s.flipped?commit(true):setFlip(true); };
    document.getElementById("swipeNo").onclick = function(){ s.flipped?commit(false):setFlip(true); };
  }

  function currentNodeIdx(){
    for(var i=0;i<CURRICULUM.length;i++){
      if(nodeUnlocked(CURRICULUM,i) && !nodeDone(CURRICULUM[i])) return i;

  function phraseOfDay(){
    var seed = 0, t = todayStr();
    for(var i=0;i<t.length;i++) seed = (seed*31 + t.charCodeAt(i)) >>> 0;
    return PHRASES[seed % PHRASES.length];
  }

  function renderPath(){
    var nodes = CURRICULUM, cur = currentNodeIdx();

    for(var i=start;i<end;i++){
      var n = nodes[i];
      var st = !nodeUnlocked(nodes,i) ? "locked" : nodeDone(n) ? "done" : (i===cur ? "current" : "available");
      var icon = n.type==="kana" ? esc(nodeRaw(n)[0][0]) : "語";
      var inner = st==="done" ? "✓" : st==="locked" ? "🔒" : '<span class="jp">'+icon+'</span>';

        '<div class="path-node-label">'+esc(n.label)+'</div></div>';

          '<div class="phrase-top">'+
            '<div class="phrase-jp jp">'+esc(ph.jp)+'</div>'+
            '<button class="speak-btn" data-speak="'+esc(ph.jp)+'">🔊</button>'+
          '</div>'+
          '<div class="phrase-romaji">'+esc(ph.romaji)+'</div>'+
          '<div class="phrase-en">'+esc(ph.en)+'</div>'+
          '<div class="phrase-when">'+esc(ph.when)+'</div>'+
        '</div>'+

        '<div class="section-label">Quick practice</div>'+
        '<div class="action-row">'+
          '<button class="action" data-action="start-lazy"><span class="ic">⚡</span>Lazy<span class="sub">5 cards</span></button>'+
          '<button class="action" data-action="swipe-vocab"><span class="ic">👆</span>Cards<span class="sub">'+masteredVocab+'/'+VOCAB.length+'</span></button>'+
          '<button class="action" data-action="trace-hiragana"><span class="ic">✏️</span>Write<span class="sub">trace</span></button>'+
          '<button class="action" data-nav="talk"><span class="ic">💬</span>Talk<span class="sub">AI chat</span></button>'+
          '<button class="action" data-action="start-daily"><span class="ic">🎯</span>Review<span class="sub">'+totalDue+' due</span></button>'+
        '</div>'+

        '<div class="section-label">Your path</div>'+
        renderPath()+
        renderRegions()+
      '</div>';

    var due = [
      {label:"Hiragana", n:kanaDueList(HIRAGANA).length, action:"practice-hiragana"},
      {label:"Katakana", n:kanaDueList(KATAKANA).length, action:"practice-katakana"},
      {label:"Vocabulary", n:vocabDueList().length, action:"practice-vocab"}
    ];
    var desktop =
      '<div class="desktop-only">'+
        '<div class="dash-grid">'+
          '<div class="dash-card"><div class="big">🔥 '+S.streak+'</div><div class="lbl">Day streak</div></div>'+
          '<div class="dash-card"><div class="big">Lv'+level()+'</div><div class="lbl">'+xpIntoLevel()+'/150 XP</div></div>'+
          '<div class="dash-card"><div class="big">'+masteredKana+'/92</div><div class="lbl">Kana mastered</div></div>'+
          '<div class="dash-card"><div class="big">'+masteredVocab+'/'+VOCAB.length+'</div><div class="lbl">Words mastered</div></div>'+
        '</div>'+
        '<div class="section-label">Up next</div>'+
        '<div class="phrase-card" style="flex-direction:row;align-items:center;gap:1rem">'+
          '<div style="flex:1"><div style="font-weight:800;font-size:1.1rem">'+esc(node.label)+'</div>'+
          '<div style="color:var(--ink-soft);font-size:.9rem">'+pct+'% complete</div></div>'+
          '<button class="btn btn-primary" data-chunk="'+cur+'">Continue →</button>'+
        '</div>'+
        '<div class="section-label">Due for review</div>'+
        '<table class="due-table"><tbody>'+due.map(function(d){
          return '<tr><td>'+d.label+'</td><td class="cnt">'+d.n+' due</td>'+
            '<td style="text-align:right"><button class="go" data-action="'+d.action+'">Practice</button></td></tr>';
        }).join("")+'</tbody></table>'+
        '<div class="section-label">Phrase of the day</div>'+
        '<div class="phrase-card">'+
          '<div class="phrase-top"><div class="phrase-jp jp">'+esc(ph.jp)+'</div>'+
          '<button class="speak-btn" data-speak="'+esc(ph.jp)+'">🔊</button></div>'+
          '<div class="phrase-romaji">'+esc(ph.romaji)+'</div>'+
          '<div class="phrase-en">'+esc(ph.en)+'</div>'+
          '<div class="phrase-when">'+esc(ph.when)+'</div>'+
        '</div>'+
        '<div class="desk-actions">'+
          '<button class="btn btn-primary" data-action="start-daily">Daily practice (10)</button>'+
          '<button class="btn btn-ghost" data-action="start-lazy">Quick (5)</button>'+
          '<button class="btn btn-ghost" data-nav="talk">Talk practice</button>'+
        '</div>'+
      '</div>';

    return mobile + desktop;
  }

  function kanaSection(list, setName, label){
    return '<div class="learn-section'+(learnTab===setName?" active":"")+'">'+
      '<h3 class="learn-heading">'+label+'</h3>'+
      '<div class="btn-row">'+
        '<button class="btn btn-primary" data-action="practice-'+setName+'">Practice</button>'+
        '<button class="btn btn-ghost" data-action="trace-'+setName+'">✏️ Trace</button>'+
      '</div>'+
      '<div class="kgrid">'+list.map(function(p,i){
        var open = kanaUnlocked(list,i), e = S.kana[p[0]];
        return '<div class="ktile '+(open?("b"+(e?e.box:0)):"locked")+'"'+
          (open?' data-kana="'+esc(p[0])+'" data-kanaset="'+setName+'"':'')+'>'+
          '<span class="c jp">'+(open?esc(p[0]):"🔒")+'</span>'+
          (open?'<span class="r">'+esc(p[1])+'</span>':'')+'</div>';
      }).join("")+'</div>'+
      '<div class="phrase-when" style="margin-top:1rem">Tap any character for its memory hook and sound.</div>'+
    '</div>';
  }

  function renderLearn(){
    var tabs = [["hiragana","あ Hira"],["katakana","ア Kata"],["vocab","語 Words"],["phrases","💬 Phrases"]];
    var seg = '<div class="segmented">'+tabs.map(function(t){
      return '<button class="'+(learnTab===t[0]?"active":"")+'" data-learntab="'+t[0]+'">'+t[1]+'</button>';
    }).join("")+'</div>';

    var vocabSection = '<div class="learn-section'+(learnTab==="vocab"?" active":"")+'">'+
      '<h3 class="learn-heading">Vocabulary</h3>'+
      '<div class="btn-row">'+
        '<button class="btn btn-primary" data-action="practice-vocab">Practice</button>'+
        '<button class="btn btn-ghost" data-action="swipe-vocab">👆 Cards</button>'+
      '</div>'+
      '<div class="vlist">'+VOCAB.map(function(v){
        var e = S.vocab[v.id];
        return '<div class="vrow" data-speak="'+esc(v.jp)+'">'+
          '<div><div class="jp">'+esc(v.jp)+'</div><div class="romaji">'+esc(v.romaji)+'</div></div>'+
          '<div class="en">'+esc(v.en)+'</div>'+
          '<div class="box-dot '+(isMastered(e)?"mastered":(isDue(e)?"due":""))+'"></div></div>';
      }).join("")+'</div></div>';

    var phraseSection = '<div class="learn-section'+(learnTab==="phrases"?" active":"")+'">'+
      '<h3 class="learn-heading">Survival phrases</h3>'+
      '<div class="phrase-when" style="margin-bottom:1rem">Real sentences you can use on day one. Tap to hear them.</div>'+
      '<div class="plist">'+PHRASES.map(function(p){
        return '<div class="prow" data-speak="'+esc(p.jp)+'">'+
          '<div class="meta"><div class="sit">'+esc(p.sit)+'</div>'+
          '<div class="jp">'+esc(p.jp)+'</div>'+
          '<div class="en">'+esc(p.romaji)+' · '+esc(p.en)+'</div></div>'+
          '<div class="speak-btn">🔊</div></div>';
      }).join("")+'</div></div>';

    return seg+'<div class="learn-body">'+
      '<div>'+kanaSection(HIRAGANA,"hiragana","Hiragana")+kanaSection(KATAKANA,"katakana","Katakana")+'</div>'+
      '<div>'+vocabSection+phraseSection+'</div></div>';
  }

  function renderSession(){
    var s = sessionState;
    if(!s || s.empty){
      return '<div class="summary">'+mascotSvg(72)+'<h2>All caught up!</h2>'+
        '<p class="prompt-sub">Nothing due in this set right now.</p>'+
        '<button class="btn btn-primary" data-nav="learn">Back to Learn</button></div>';
    }
    var item = s.queue[s.idx];
    return '<div class="session">'+
      '<div class="session-top"><button class="session-exit" data-nav="home">✕</button>'+
        '<div class="session-progress"><div style="width:'+Math.round(s.idx/s.queue.length*100)+'%"></div></div></div>'+
      mascotSvg(44)+
      '<div class="prompt-jp jp"'+(item.type==="vocab"?' style="font-size:2.9rem"':'')+'>'+esc(item.promptJp)+'</div>'+
      (item.sub?'<div class="prompt-sub">'+esc(item.sub)+'</div>':'')+
      '<button class="speak-btn" data-speak="'+esc(item.promptJp)+'">🔊</button>'+
      '<div class="session-spacer"></div>'+
      '<div class="choices" id="choicesWrap">'+item.choices.map(function(c,i){
        return '<button class="choice" data-choice="'+i+'">'+esc(c.text)+'</button>';
      }).join("")+'</div></div>';
  }

  function renderSummary(){
    var s = sessionState;
    var earned = s ? S.xp-s.startXp : 0;
    var sub;
    if(s && s.kind==="trace") sub = s.count+' character'+(s.count===1?"":"s")+' traced';
    else {
      var acc = s && s.queue.length ? Math.round(s.correct/s.queue.length*100) : 0;
      sub = (s?s.correct:0)+'/'+(s?s.queue.length:0)+' correct · '+acc+'%';
    }
    return '<div class="summary">'+mascotSvg(88)+
      '<h2>Session complete!</h2>'+
      '<div class="xp-earned">+'+earned+' XP</div>'+
      '<p class="prompt-sub">'+sub+'</p>'+
      '<button class="btn btn-primary btn-block" data-nav="home">Back to Home</button></div>';
  }

  function renderProgress(){
    var allKana = HIRAGANA.concat(KATAKANA);
    var kb=[0,0,0,0,0,0], vb=[0,0,0,0,0,0];
    allKana.forEach(function(p){ var e=S.kana[p[0]]; kb[e?e.box:0]++; });
    VOCAB.forEach(function(v){ var e=S.vocab[v.id]; vb[e?e.box:0]++; });
    function bars(c, total){
      var groups = [
        {lbl:"New", n:c[0], col:"var(--line-strong)"},
        {lbl:"Learning", n:c[1]+c[2], col:"var(--gold)"},
        {lbl:"Reviewing", n:c[3]+c[4], col:"var(--jade-soft)"},
        {lbl:"Mastered", n:c[5], col:"var(--jade)"}
      ];
      return '<div class="barlist">'+groups.map(function(g){
        return '<div class="barrow"><div class="lbl">'+g.lbl+'</div>'+
          '<div class="track"><div class="fill" style="width:'+(total?Math.round(g.n/total*100):0)+'%;background:'+g.col+'"></div></div>'+
          '<div class="val">'+g.n+'</div></div>';
      }).join("")+'</div>';
    }
    return '<div class="stat-block">'+
        '<div class="stat-box"><div class="big">🔥 '+S.streak+'</div><div class="lbl">Day streak</div></div>'+
        '<div class="stat-box"><div class="big">⭐ '+S.xp+'</div><div class="lbl">Total XP · Level '+level()+'</div></div>'+
      '</div>'+
      '<div class="section-label">Kana mastery ('+allKana.length+')</div>'+bars(kb, allKana.length)+
      '<div class="section-label">Vocabulary mastery ('+VOCAB.length+')</div>'+bars(vb, VOCAB.length)+
      '<div class="section-label">Survival phrases</div>'+
      '<div class="phrase-when">'+PHRASES.length+' everyday phrases available in Learn → Phrases. These are reference material, not drilled.</div>';
  }

  // ---------------- talk ----------------
  function renderTalk(){
    if(!talkState) talkState = {personaId:"yuki", turns:[], loading:false, error:null, started:false};
    var t = talkState;
    var row = '<div class="persona-row">'+PERSONAS.map(function(p){
      return '<div class="persona-card'+(t.personaId===p.id?" active":"")+'"'+(claudeSample?' data-persona="'+p.id+'"':'')+'>'+
        '<div class="av">'+p.avatar+'</div><div class="nm">'+p.name+'</div><div class="rl">'+esc(p.role)+'</div></div>';
    }).join("")+'</div>';
    if(!claudeSample){
      return row+'<div class="notice">AI conversation practice runs only when this app is opened as a Claude artifact with Claude access allowed.</div>';
    }
    return row+
      '<div class="chat-log" id="chatLog"></div>'+
      (t.error?'<div class="banner" style="background:var(--accent-soft);border-color:var(--accent)">'+esc(t.error)+'</div>':'')+
      '<form class="chat-form" id="chatForm">'+
        '<input class="chat-input" id="chatInput" placeholder="Type in English or Japanese…" autocomplete="off"'+(t.loading?" disabled":"")+'>'+
        '<button class="chat-send" type="submit"'+(t.loading?" disabled":"")+'>➤</button>'+
      '</form>';
  }
  function personaInstruction(p){
    return "You are "+p.name+", a "+p.role+" inside a Japanese conversation-practice app. "+
      "Personality: "+p.style+". The learner is a complete beginner (knows some hiragana and basic words). "+
      "Rules: reply mostly in very simple Japanese (N5 level, short sentences). After each Japanese sentence, add the romaji in parentheses and a short English translation in square brackets. "+
      "Keep replies to 2-4 short sentences total. If the learner's message has a Japanese mistake, gently show the corrected form first, then continue naturally. "+
      "Stay in character the whole time and end your reply with a simple follow-up question to keep the conversation going. "+
      "Begin the conversation now with a short in-character greeting.";
  }
  function talkAfterRender(){
    if(!claudeSample) return;
    var log = document.getElementById("chatLog"), t = talkState;
    log.innerHTML = t.turns.map(function(m){
      return '<div class="bubble '+(m.role==="user"?"me":"them")+'">'+esc(m.content)+'</div>';
    }).join("");
    log.scrollTop = log.scrollHeight;
    if(!t.started){ t.started = true; startConversation(); }
    var form = document.getElementById("chatForm");
    if(form) form.onsubmit = function(ev){
      ev.preventDefault();
      var input = document.getElementById("chatInput"), val = input.value.trim();
      if(!val || t.loading) return;
      input.value=""; sendTalkMessage(val);
    };
  }
  function appendBubble(role, text){
    var log = document.getElementById("chatLog");
    var div = document.createElement("div");
    div.className = "bubble "+(role==="user"?"me":"them");
    div.textContent = text;
    log.appendChild(div); log.scrollTop = log.scrollHeight;
    return div;
  }
  function runTalk(msgs, bubble){
    var t = talkState;
    return claudeSample(msgs, {
      cache:false,
      onText:function(u){ bubble.textContent = u.text; var l=document.getElementById("chatLog"); if(l) l.scrollTop=999999; }
    }).then(function(res){
      t.turns.push({role:"assistant", content:res.text});
      t.loading=false; render();
    }).catch(function(err){
      t.loading=false; t.error=talkErrorMessage(err); bubble.remove(); render();
    });
  }
  function startConversation(){
    var t = talkState, p = PERSONAS.filter(function(x){return x.id===t.personaId;})[0];
    t.loading = true;
    runTalk([{role:"user", content:personaInstruction(p)}], appendBubble("assistant","…thinking…"));
  }
  function sendTalkMessage(text){
    var t = talkState, p = PERSONAS.filter(function(x){return x.id===t.personaId;})[0];
    t.turns.push({role:"user", content:text});
    t.error=null; t.loading=true;
    appendBubble("user", text);
    var bubble = appendBubble("assistant","…thinking…");
    S.xp += 5; persist();
    runTalk([{role:"user", content:personaInstruction(p)}].concat(t.turns), bubble);
  }
  function talkErrorMessage(err){
    var code = err && err.code;
    if(code==="not_granted") return "Claude access was declined for this app. Allow it to chat here.";
    if(code==="rate_limited") return "Too many messages right now — wait a moment and try again.";
    if(code==="session_expired") return "Please sign in again to continue chatting.";
    return "Something went wrong. Try sending that again.";
  }
  function switchPersona(id){
    talkState = {personaId:id, turns:[], loading:false, error:null, started:false};
    render();
  }

  // ---------------- events ----------------
  function attachHandlers(){
    document.getElementById("app").addEventListener("click", onRootClick);
    document.getElementById("tabbar").addEventListener("click", onRootClick);
    document.getElementById("sheetRoot").addEventListener("click", onRootClick);
  }

  function onRootClick(ev){
    var el = ev.target.closest("[data-nav],[data-action],[data-speak],[data-choice],[data-learntab],[data-persona],[data-chunk],[data-kana],[data-sheet]");
    if(!el) return;
    if(el.dataset.sheet==="close"){ closeSheet(); return; }
    if(el.dataset.kana){ openSheet(el.dataset.kanaset, el.dataset.kana); return; }
    if(el.dataset.chunk!=null){ closeSheet(); startChunkSession(parseInt(el.dataset.chunk,10)); return; }
    if(el.dataset.choice!=null){ answerChoice(parseInt(el.dataset.choice,10)); return; }
    if(el.dataset.speak){ speak(el.dataset.speak); if(!el.dataset.nav && !el.dataset.action) return; }
    if(el.dataset.persona){ switchPersona(el.dataset.persona); return; }
    if(el.dataset.learntab){ learnTab = el.dataset.learntab; view="learn"; render(); return; }
    var a = el.dataset.action;
    if(a){
      closeSheet();
      if(a==="start-daily") startSession("mixed",10,"Daily Practice");
      else if(a==="start-lazy") startSession("mixed",5,"Quick Practice");
      else if(a==="practice-hiragana") startSession("hiragana",10,"Hiragana");
      else if(a==="practice-katakana") startSession("katakana",10,"Katakana");
      else if(a==="practice-vocab") startSession("vocab",10,"Vocabulary");
      else if(a==="trace-hiragana") startTrace("hiragana");
      else if(a==="trace-katakana") startTrace("katakana");
      else if(a==="swipe-vocab") startSwipe();
      return;
    }
    if(el.dataset.nav){ closeSheet(); setView(el.dataset.nav); return; }
  }

  function applyTheme(t){
    if(t==="light") document.documentElement.setAttribute("data-theme","light");
    else if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme");
    var btn = document.getElementById("themeToggle");
    if(btn) btn.textContent = t==="dark" ? "🌙" : "☀️";
  }
  function initTheme(){
    var saved=null;
    try{ saved = localStorage.getItem("nihongo_theme"); }catch(e){}
    applyTheme(saved || "light");
    document.getElementById("themeToggle").addEventListener("click", function(){
      var next = (document.documentElement.getAttribute("data-theme")||"light")==="dark" ? "light" : "dark";
      applyTheme(next);
      try{ localStorage.setItem("nihongo_theme", next); }catch(e){}
    });
  }
  initTheme();

  initCapabilities().then(loadState).then(function(){
    applyDailyStreak();
    render();
  });
})();
</script>
